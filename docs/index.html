<!doctype html>                                                                                                                   
<html lang="en">                                                                                                                  
<head>                                                                                                                            
  <meta charset="utf-8">                                                                                                          
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">                                        
  <meta name="color-scheme" content="light dark">                                                                                 
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">                                               
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">                                                
  <title>TL;DR</title>                                                                                                            
  <link rel="manifest" href="manifest.json">                                                                                      
  <link rel="icon" href="icon.svg" type="image/svg+xml">                                                                          
  <link rel="stylesheet" href="style.css?v=5">                                                                                    
</head>                                                                                                                           
<body>                                                                                                                            
                                                                                                                                  
  <header class="top">                                                                                                            
    <button class="brand" id="brand" aria-label="Back to top">TL<span class="semi">;</span>DR</button>                            
    <div class="status">                                                                                                          
      <span class="stat" id="counter"></span>                                                                                     
      <span class="stat fresh" id="fresh"></span>                                                                                 
      <button class="icon-btn" id="sync" aria-label="Your data">                                                                  
        <svg viewBox="0 0 24 24"><path d="M4 16.2A4.5 4.5 0 0 1 6.5 8a6 6 0 0 1 11.6 1.5A4 4 0 0 1 18 17.5H7"/><path d="M12       
        12v9"/><path d="m8.5 15.5 3.5-3.5 3.5 3.5"/></svg>                                                                        
      </button>                                                                                                                   
      <button class="icon-btn" id="theme" aria-label="Switch theme">                                                              
        <svg class="ic-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A5.5 5.5 0 0 1 13.4 3.1C13 3 12.5 3  
        12 3z"/></svg>                                                                                                            
        <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7      
        17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>                                                    
      </button>                                                                                                                   
    </div>                                                                                                                        
  </header>                                                                                                                       
                                                                                                                                  
  <div class="ptr" id="ptr" aria-hidden="true"><span class="ptr-arrow">↓</span><span class="ptr-text">Pull to refresh</span></div>
                                                                                                                                  
  <main class="deck" id="deck"></main>                                                                                            
                                                                                                                                  
  <!-- data sheet: opened by the cloud button in the header -->                                                                   
  <section class="sheet" id="sheet" hidden>                                                                                       
    <div class="sheet-card">                                                                                                      
      <h3>Your data</h3>                                                                                                          
      <pre id="stats"></pre>                                                                                                      
      <div class="sheet-actions">                                                                                                 
        <button class="btn" id="export">Export events.json</button>                                                               
        <button class="btn ghost" id="unsee">Show seen again</button>                                                             
        <button class="btn ghost" id="close">Close</button>                                                                       
      </div>                                                                                                                      
    </div>                                                                                                                        
  </section>                                                                                                                      
                                                                                                                                  
  <template id="card-tpl">                                                                                                        
    <article class="card">                                                                                                        
      <div class="media">                                                                                                         
        <img class="img" alt="" loading="lazy" decoding="async">                                                                  
        <span class="ph-letter" aria-hidden="true"></span>                                                                        
        <span class="badge" hidden></span>                                                                                        
        <span class="heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.2 5.3 5.3 
        0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg></span>                                                                        
      </div>                                                                                                                      
      <div class="body">                                                                                                          
        <p class="meta"><span class="cat"></span><span class="sep"></span><span class="src"></span><span class="sep"></span><span 
        class="age"></span></p>                                                                                                   
        <h2 class="headline"></h2>                                                                                                
        <p class="summary"></p>                                                                                                   
        <div class="why" hidden>                                                                                                  
          <span>Why?</span>                                                                                                       
          <button data-r="source">Source</button><button data-r="topic">Topic</button>                                            
          <button data-r="not_news">Not news</button><button data-r="known">Already know</button>                                 
        </div>                                                                                                                    
      </div>                                                                                                                      
      <div class="actions">                                                                                                       
        <button class="act dislike" aria-label="Less like this" aria-pressed="false">                                             
          <svg viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5      
          2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>                     
        </button>                                                                                                                 
        <button class="act like" aria-label="Like" aria-pressed="false">                                                          
          <svg viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5    
          22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>                      
        </button>                                                                                                                 
        <span class="gap"></span>                                                                                                 
        <button class="act dup" aria-label="Seen this story already" aria-pressed="false">                                        
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1    
          2-2h9a2 2 0 0 1 2 2v1"/></svg>                                                                                          
        </button>                                                                                                                 
        <button class="act save" aria-label="Save" aria-pressed="false">                                                          
          <svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>                          
        </button>                                                                                                                 
        <a class="read" target="_blank" rel="noopener">Read<svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8             
        7h9v9"/></svg></a>                                                                                                        
      </div>                                                                                                                      
    </article>                                                                                                                    
  </template>                                                                                                                     
                                                                                                                                  
  <script src="app.js?v=5"></script>                                                                                              
</body>                                                                                                                           
</html>
