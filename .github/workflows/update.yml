name: Update feed                                                                                                                 
                                                                                                                                      
on:                                                                                                                               
  schedule:                                                                                                                       
    - cron: "0 */2 * * *"      # every 2 hours (UTC); GitHub may delay by a few minutes                                           
  workflow_dispatch:           # manual "Run workflow" button                                                                     
                                                                                                                                  
concurrency:                                                                                                                      
  group: update-feed                                                                                                              
  cancel-in-progress: false    # never run two at once; the second waits                                                          
                                                                                                                                  
permissions:                                                                                                                      
  contents: write                                                                                                                 
                                                                                                                                  
jobs:                                                                                                                             
  update:                                                                                                                         
    runs-on: ubuntu-latest                                                                                                        
    timeout-minutes: 20                                                                                                           
                                                                                                                                  
    steps:                                                                                                                        
      - name: Check out repo                                                                                                      
        uses: actions/checkout@v4                                                                                                 
                                                                                                                                  
      - name: Set up Python                                                                                                       
        uses: actions/setup-python@v5                                                                                             
        with:                                                                                                                     
          python-version: "3.12"                                                                                                  
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_cache.json docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
